name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_collector/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android_collector/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p android_collector --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          APK="android_collector/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/youtube-library-collector-debug.apk
          sha256sum artifacts/youtube-library-collector-debug.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-library-collector-debug
          path: |
            artifacts/youtube-library-collector-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
