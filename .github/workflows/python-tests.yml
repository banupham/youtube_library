name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile profile pipeline
        run: |
          python -m py_compile scripts/homepage/home_bridge.py
          python -m py_compile scripts/profile/build_consolidated_profile.py
          python -m py_compile scripts/profile/build_temporal_profile.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
