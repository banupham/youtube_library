name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project Python modules
        run: |
          python -m py_compile scripts/homepage/home_bridge.py
          python -m py_compile scripts/profile/build_consolidated_profile.py
          python -m py_compile scripts/profile/build_temporal_profile.py
          python -m py_compile scripts/viewer/generate_viewers.py
          python -m py_compile scripts/viewer/summarize_viewer_batch.py
          python -m py_compile scripts/community/build_community_report.py
          python -m py_compile scripts/community/submit_profile.py
          python -m py_compile scripts/community/community_server.py
          python -m py_compile scripts/community/collector_agent.py
          python -m py_compile scripts/android/inspect_accessibility_snapshots.py
      - name: Validate JSON seed/schema/manifest files
        run: |
          python -m json.tool taxonomy/interest_relations.v1.json > /dev/null
          python -m json.tool schemas/viewer_robot.v1.schema.json > /dev/null
          python -m json.tool schemas/community_profile_submission.v1.schema.json > /dev/null
          python -m json.tool schemas/android_accessibility_snapshot.v1.schema.json > /dev/null
          python -m json.tool browser_extension/youtube_home_collector/manifest.json > /dev/null
      - name: Validate Android XML files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              'android_collector/app/src/main/AndroidManifest.xml',
              'android_collector/app/src/main/res/xml/accessibility_service_config.xml',
              'android_collector/app/src/main/res/values/strings.xml',
          ]:
              ET.parse(path)
              print('OK', path)
          PY
      - name: Validate extension JavaScript syntax
        run: |
          node --check browser_extension/youtube_home_collector/background.js
          node --check browser_extension/youtube_home_collector/passive_collector.js
          node --check browser_extension/youtube_home_collector/popup_passive.js
          node --check browser_extension/youtube_home_collector/popup.js
          node --check browser_extension/youtube_home_collector/subscriptions.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
